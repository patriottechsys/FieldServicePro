{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="empty-state" style="padding: var(--space-12) var(--space-6);">
  <i class="bi bi-question-circle" style="display: block; font-size: 3rem; color: var(--color-text-muted); margin-bottom: var(--space-4);"></i>
  <h3 style="font-size: var(--font-size-xl);">Page Not Found</h3>
  <p style="color: var(--color-text-muted);">The page you're looking for doesn't exist or has been moved.</p>
  <div style="margin-top: var(--space-4); display: flex; gap: var(--space-3); justify-content: center;">
    <a href="{{ url_for('dashboard') }}" class="btn btn-accent">
      <i class="bi bi-house"></i> Go to Dashboard
    </a>
    <button onclick="history.back()" class="btn btn-outline">
      <i class="bi bi-arrow-left"></i> Go Back
    </button>
  </div>
</div>
{% endblock %}
